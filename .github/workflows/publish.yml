name: Deploy library on NPM

on:
  release:
    types: [published]

# Declare default permissions as read only.
permissions: read-all

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    outputs:
      PACKAGE_NAME: ${{ steps.get_package_info.outputs.NPM_PACKAGE_NAME }}
      PACKAGE_VERSION: ${{ steps.get_package_info.outputs.NPM_PACKAGE_VERSION }}
      NODE_VERSION: ${{ steps.get_package_info.outputs.NODE_VERSION }}
      TARBALL: ${{ steps.pack.outputs.TARBALL }}
      PRE_UPLOAD_HASH: ${{ steps.pack.outputs.PRE_UPLOAD_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Check file existence"
        id: check_files
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: "package.json, README.md"

      - name: File exists
        if: steps.check_files.outputs.files_exists != 'true'
        # Only runs if all of the files exists
        run: exit 1

      - name: Get package.json package name and match with repository name
        run: |
          echo PACKAGE_NAME=$(cat package.json | jq -r .name | cut -f2 -d"\"" | cut -f2 -d"@") >> $GITHUB_OUTPUT
          echo PACKAGE_VERSION="refs/tags/v"$(cat package.json | jq -r .version) >> $GITHUB_OUTPUT
          echo PACKAGE_REPOSITORY=$(cat package.json | jq -r .repository.url | sed 's/\+https//') >> $GITHUB_OUTPUT
          echo NPM_PACKAGE_NAME=$(cat package.json | jq -r .name) >> $GITHUB_OUTPUT
          echo NPM_PACKAGE_VERSION=$(cat package.json | jq -r .version) >> $GITHUB_OUTPUT
          echo NODE_VERSION=$(cat .nvmrc) >> $GITHUB_OUTPUT
        id: get_package_info

      - name: Print outputs for debugging
        run: |
          echo "GitHub Repository: ${{ github.repository }}"
          echo "Package Name: ${{ steps.get_package_info.outputs.PACKAGE_NAME }}"
          echo "Github Tag: ${{ github.ref }}"
          echo "Package Version: ${{ steps.get_package_info.outputs.PACKAGE_VERSION }}"
          echo "GitHub Repository URL: ${{ github.repositoryUrl }}"
          echo "Package Repository: ${{ steps.get_package_info.outputs.PACKAGE_REPOSITORY }}"
          echo "Node Version: ${{ steps.get_package_info.outputs.NODE_VERSION }}"

      - name: Check if package_name matches with repository name
        if: github.repository != steps.get_package_info.outputs.PACKAGE_NAME
        # Fail if package name not properly configured
        run: exit 1

      - name: Check if package version matches with tag
        if: github.event_name == 'release' && github.ref != steps.get_package_info.outputs.PACKAGE_VERSION
        # Fail if package version not properly setted
        run: exit 1

      - name: Check if package repository matches with repository
        if: github.repositoryUrl != steps.get_package_info.outputs.PACKAGE_REPOSITORY
        # Fail if package repository doesn't match with repository
        run: exit 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Clean install dependencies
        run: |
          rm -rf dist
          npm ci
      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        run: |
          rm -f *.tgz
          TARBALL=$(npm pack --json | jq -r '.[0].filename')
          PRE_UPLOAD_HASH=$(sha1sum "$TARBALL" | awk '{print $1}')
          echo "TARBALL=$TARBALL" >> $GITHUB_OUTPUT
          echo "PRE_UPLOAD_HASH=$PRE_UPLOAD_HASH" >> $GITHUB_OUTPUT
          echo "TARBALL: $TARBALL"
          echo "PRE_UPLOAD_HASH: $PRE_UPLOAD_HASH"

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: ${{ steps.pack.outputs.TARBALL }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build

    environment: npm-publish

    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Download package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball

      - name: Verify downloaded tarball
        env:
          TARBALL: ${{ needs.build.outputs.TARBALL }}
          PRE_UPLOAD_HASH: ${{ needs.build.outputs.PRE_UPLOAD_HASH }}
        run: |
          set -euo pipefail
          if [[ ! "$TARBALL" =~ ^[A-Za-z0-9._-]+\.tgz$ ]] || [ ! -f "$TARBALL" ] || [ -L "$TARBALL" ]; then
            echo "Invalid tarball: '$TARBALL'"
            exit 1
          fi
          if [[ ! "$PRE_UPLOAD_HASH" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid PRE_UPLOAD_HASH: '$PRE_UPLOAD_HASH'"
            exit 1
          fi
          DOWNLOADED_HASH=$(sha1sum "$TARBALL" | awk '{print $1}')
          echo "DOWNLOADED_HASH: $DOWNLOADED_HASH"
          echo "PRE_UPLOAD_HASH: $PRE_UPLOAD_HASH"
          if [ "$DOWNLOADED_HASH" != "$PRE_UPLOAD_HASH" ]; then
            echo "Hash mismatch detected!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: ${{ needs.build.outputs.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Check if version is already published
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.PACKAGE_NAME }}
          PACKAGE_VERSION: ${{ needs.build.outputs.PACKAGE_VERSION }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is already published."
            exit 0
          fi

          echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is not published. Proceeding with publishing..."

      - name: Upload beta package
        if: github.event_name == 'release' && github.event.release.prerelease == true
        env:
          TARBALL: ${{ needs.build.outputs.TARBALL }}
        run: npm publish "./$TARBALL" --tag beta

      - name: Upload package
        if: github.event_name == 'release' && github.event.release.prerelease == false
        env:
          TARBALL: ${{ needs.build.outputs.TARBALL }}
        run: npm publish "./$TARBALL"

      - name: Post upload validation
        id: unpack
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.PACKAGE_NAME }}
          PACKAGE_VERSION: ${{ needs.build.outputs.PACKAGE_VERSION }}
        run: |
          FULL_PACKAGE_NAME="$PACKAGE_NAME@$PACKAGE_VERSION"

          # Wait for package propagation
          echo "Waiting for package propagation..."
          sleep 15

          # Fetch the shasum from npm
          POST_UPLOAD_HASH=$(npm view "$FULL_PACKAGE_NAME" dist.shasum)
          echo "POST_UPLOAD_HASH=$POST_UPLOAD_HASH" >> $GITHUB_OUTPUT
          echo "POST_UPLOAD_HASH: $POST_UPLOAD_HASH"

      - name: Pre and Post Upload validation
        env:
          PRE_UPLOAD_HASH: ${{ needs.build.outputs.PRE_UPLOAD_HASH }}
          POST_UPLOAD_HASH: ${{ steps.unpack.outputs.POST_UPLOAD_HASH }}
        run: |
          echo "Comparing hashes..."
          echo "PRE_UPLOAD_HASH: '$PRE_UPLOAD_HASH'"
          echo "POST_UPLOAD_HASH: '$POST_UPLOAD_HASH'"

          if [ "$PRE_UPLOAD_HASH" != "$POST_UPLOAD_HASH" ]; then
            echo "Hash mismatch detected!"
            exit 1
          fi
          echo "Hashes match successfully!"
