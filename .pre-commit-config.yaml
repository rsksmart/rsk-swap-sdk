repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 38980559e3a605691d6579f96222c30778e5a69e  # frozen: 3.0.0
  hooks:
  - id: shellcheck
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: "trailing-whitespace"
    - id: "end-of-file-fixer"
      exclude: '\.tf\.json$'
    - id: "check-yaml"
      args:
        - "--unsafe"
    - id: "check-executables-have-shebangs"
    - id: "check-case-conflict"
- repo: local
  hooks:
    - id: code-style
      name: Project Style Check
      entry: npm run lint:validation
      language: system
      types: [file]
      files: ^.*\.(ts|js)$
      pass_filenames: false
- repo: local
  hooks:
    - id: sync-integration-lockfile
      name: Sync integration-test lockfile
      entry: npm install --package-lock-only --prefix integration-test
      language: system
      files: ^package\.json$
      pass_filenames: false
- repo: local
  hooks:
    - id: unit-tests
      name: Project Unit Tests
      entry: npm run test
      language: system
      types: [file]
      files: ^.*\.(ts|js)$
      pass_filenames: false
